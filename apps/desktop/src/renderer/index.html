<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Strict CSP for the renderer. Everything ships local ('self' covers both
      the dev server origin and the packaged file:// load); voice websockets
      and TTS fetches run in the main process, so connect-src stays tight.
      Dev-mode allowances:
      - the sha256 hash is @vitejs/plugin-react's inline fast-refresh preamble
        (recompute on plugin upgrade: sha256-base64 of preambleCode with
        __BASE__ -> "/"); prod has no inline scripts.
      - ws://localhost/127.0.0.1 is Vite's HMR socket; unused in prod.
      - style-src 'unsafe-inline' covers Vite's dev style injection and React
        inline style attributes.
      img-src allows https:/data: because note and chat markdown may render
      agent-supplied or user-authored remote images.
      frame-src allows the vault-app: scheme so HTML Apps (vault .html files)
      render in their sandboxed iframe; the app document itself gets an opaque
      origin (sandbox has no allow-same-origin) and can't reach the host.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-Z2/iFzh9VMlVkEOar1f/oSHWwQk3ve1qk/C2WdsC4Xk='; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src vault-app:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
