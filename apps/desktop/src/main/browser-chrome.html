<!doctype html>
<!-- The browser window's chrome bar: shell-bundled, loaded from disk, and the
     only page in this process with a preload. Plain HTML on purpose — it must
     never grow a build of its own, and everything it can do is the fixed verb
     set browser-preload.ts exposes. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Browser</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        height: 44px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px 0 84px; /* traffic-light inset */
        font:
          13px -apple-system,
          system-ui,
          sans-serif;
        background: light-dark(#f0f2f2, #141415);
        color: light-dark(#1a1a1a, #e6e6e6);
        -webkit-app-region: drag;
        user-select: none;
        box-sizing: border-box;
      }
      button,
      input {
        -webkit-app-region: no-drag;
        font: inherit;
        color: inherit;
        border: 0;
        border-radius: 8px;
        background: transparent;
      }
      button {
        width: 28px;
        height: 28px;
        cursor: pointer;
      }
      button:hover:enabled {
        background: light-dark(rgb(0 0 0 / 0.06), rgb(255 255 255 / 0.08));
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #address {
        flex: 1;
        height: 28px;
        padding: 0 10px;
        background: light-dark(rgb(0 0 0 / 0.05), rgb(255 255 255 / 0.07));
        outline: none;
        min-width: 0;
      }
      #address:focus {
        background: light-dark(#ffffff, rgb(255 255 255 / 0.12));
      }
      #send {
        width: auto;
        padding: 0 10px;
        white-space: nowrap;
      }
      #send.sent {
        color: light-dark(#0a7d33, #58c082);
      }
    </style>
  </head>
  <body>
    <button id="back" title="Back" aria-label="Back">‹</button>
    <button id="forward" title="Forward" aria-label="Forward">›</button>
    <button id="reload" title="Reload" aria-label="Reload">⟳</button>
    <input id="address" spellcheck="false" placeholder="Search or enter address" />
    <button id="send" title="Send page to agent">Send to agent</button>
    <script>
      const bridge = window.inteligirBrowser;
      const address = document.getElementById("address");
      const back = document.getElementById("back");
      const forward = document.getElementById("forward");
      const send = document.getElementById("send");
      let addressFocused = false;

      address.addEventListener("focus", () => {
        addressFocused = true;
        address.select();
      });
      address.addEventListener("blur", () => {
        addressFocused = false;
      });
      address.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          bridge.navigate(address.value);
          address.blur();
        }
      });
      back.addEventListener("click", () => bridge.back());
      forward.addEventListener("click", () => bridge.forward());
      document.getElementById("reload").addEventListener("click", () => bridge.reload());
      send.addEventListener("click", async () => {
        send.disabled = true;
        send.textContent = "Sending…";
        const result = await bridge.sendToAgent();
        send.textContent = result.ok ? "Sent ✓" : "Failed";
        send.classList.toggle("sent", result.ok);
        if (!result.ok) send.title = result.detail;
        setTimeout(() => {
          send.disabled = false;
          send.textContent = "Send to agent";
          send.classList.remove("sent");
        }, 2000);
      });
      bridge.onState((state) => {
        if (!addressFocused) address.value = state.url;
        back.disabled = !state.canGoBack;
        forward.disabled = !state.canGoForward;
      });
    </script>
  </body>
</html>
