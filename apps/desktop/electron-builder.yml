# NOTE: package only via `release`/`release:publish` — they run
# `electron-vite build` under `pnpm with-env` (dotenv -e .env) so the bundled
# Google OAuth client (INTELIGIR_GOOGLE_OAUTH_CLIENT_ID/_SECRET, see
# .env.example) bakes into .output/app/main. Building without those vars
# ships an artifact whose Google connect falls back to the GCP dialog.
appId: com.inteligir.desktop
productName: Inteligir
# inteligir:// deep links (capture + nav verbs). CFBundleURLTypes on macOS —
# required for cold-launch delivery; runtime registration in main/deep-link.ts
# (packaged builds only) covers the rest.
protocols:
  - name: Inteligir
    schemes:
      - inteligir
directories:
  buildResources: resources
  output: .output/bin
files:
  - .output/app/**/*
  - package.json
  # The main process bundles all JS deps (tree-shaken), so node_modules would
  # otherwise be dead weight duplicated into the asar. Exclude it wholesale,
  # then re-include only the native modules that CAN'T be bundled and must sit
  # on disk: sherpa-onnx-node + its per-platform binary package (sherpa-onnx-*).
  # (koffi is bundled but only invoked on Windows — dead on mac, so not shipped.)
  - "!node_modules/**"
  - node_modules/sherpa-onnx-*/**/*
# Bundled agent assets (skills/, AGENTS.md) — canonical copy lives in
# packages/agent/resources/agent; copied to Contents/Resources/agent, which is
# where the electron platform's resourcesDir points in packaged builds.
extraResources:
  - from: ../../packages/agent/resources/agent
    to: agent
asarUnpack:
  # sherpa-onnx-node ships native .node binaries (split into per-platform
  # optional deps like sherpa-onnx-darwin-arm64 — note: no "-node" infix).
  # .node files can't be require()'d from inside an asar, so unpack the whole
  # sherpa-onnx-* tree (main package + the platform binary package).
  - node_modules/sherpa-onnx-*/**/*
mac:
  # electron-updater's MacUpdater can only install from a zip (Squirrel.Mac
  # format) listed in latest-mac.yml — the dmg is first-install only. Dropping
  # zip here strands every shipped install on its version.
  target:
    - dmg
    - zip
  artifactName: Inteligir-${version}-${arch}-mac.${ext}
  category: public.app-category.productivity
  icon: resources/icon.icns
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  hardenedRuntime: true
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: Inteligir uses the microphone for voice dictation (on-device speech-to-text).
    NSAppleEventsUsageDescription: Inteligir uses Apple Events to control other applications when you ask the agent to act on them.
    NSScreenCaptureUsageDescription: Inteligir captures the screen so the agent can see and interact with native applications.
dmg:
  artifactName: Inteligir-${version}-${arch}.${ext}
# Electron fuses — flipped in the binary pre-signing (app-builder-lib
# platformPackager). Defence in depth on a notarized, TCC-granted app: without
# these the shipped binary will happily run arbitrary JS as node
# (ELECTRON_RUN_AS_NODE), accept --inspect, and honour NODE_OPTIONS. Safe to
# disable for this app: nothing in first-party source reads ELECTRON_RUN_AS_NODE
# or NODE_OPTIONS, and there is no process.fork/utilityProcess (the executor is
# a separate spawned binary, unaffected).
#
# grantFileProtocolExtraPrivileges is deliberately LEFT ALONE — the packaged
# renderer still loads over file:// (main/index.ts), so revoking it breaks the
# app. Revisit together with an app:// migration.
#
# MUST be validated with a real packaged build before shipping — hardened
# runtime is not applied by `pnpm dev:desktop`, so this cannot be exercised in
# dev. enableEmbeddedAsarIntegrityValidation + onlyLoadAppFromAsar are the two
# that fail CLOSED (the app will not launch) on an asar hash mismatch.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
npmRebuild: false
publish:
  provider: github
  owner: kyh
  repo: inteligir
  # Publish straight to a live release instead of electron-builder's default
  # draft, so `release:publish` doesn't require a manual un-draft step.
  releaseType: release
