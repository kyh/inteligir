# Signed with the Developer ID electron-builder finds in the keychain and notarized when
# APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER are set; README.md § Packaging has
# the release path. Without a cert or those variables the step is skipped, not failed.
appId: com.inteligir.desktop
productName: Inteligir
directories:
  buildResources: resources
  output: .output/bin
# node_modules unpacked: the server is spawned as a child process and cannot run from an asar
asar: true
asarUnpack:
  - node_modules/**
files:
  - .output/app/**
  - node_modules/**
  - package.json
  - resources/icon.png
  - "!**/*.map"
# npmRebuild off: the three native modules are prebuilt Node-API addons (ABI-stable across
# Node and Electron), and a rebuild would clobber the pnpm store's shared copy
npmRebuild: false
mac:
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: Inteligir-${version}-${arch}.${ext}
  category: public.app-category.productivity
  icon: resources/icon.icns
  hardenedRuntime: true
  # named explicitly: the default is "if exists", and a missing file signs an app with no
  # entitlements, which Electron then cannot start
  entitlements: resources/entitlements.mac.plist
  notarize: true
  extendInfo:
    # macOS kills a process that touches the microphone without this string
    NSMicrophoneUsageDescription: Inteligir uses the microphone for dictation. Audio goes to the local server on this machine and no further.
dmg:
  sign: false
publish: null
