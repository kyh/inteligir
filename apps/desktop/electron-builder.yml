# NOTE: package only via `release`/`release:publish`. They run `electron-vite
# build` under `pnpm with-env` (dotenv -e .env), which is what bakes
# INTELIGIR_APP_URL into the shell — a build without it ships pointing at the
# production default.
appId: com.inteligir.desktop
productName: Inteligir
# inteligir:// deep links (capture + nav verbs). CFBundleURLTypes on macOS —
# required for cold-launch delivery; runtime registration in main/deep-link.ts
# (packaged builds only) covers the rest.
protocols:
  - name: Inteligir
    schemes:
      - inteligir
directories:
  buildResources: resources
  output: .output/bin
files:
  - .output/app/**/*
  - package.json
  - resources/icon.png
  # The main process bundles all its JS deps (tree-shaken), so node_modules is
  # dead weight duplicated into the asar.
  - "!node_modules/**"
mac:
  # electron-updater's MacUpdater can only install from a zip (Squirrel.Mac
  # format) listed in latest-mac.yml — the dmg is first-install only. Dropping
  # zip here strands every shipped install on its version.
  target:
    - dmg
    - zip
  artifactName: Inteligir-${version}-${arch}-mac.${ext}
  category: public.app-category.productivity
  icon: resources/icon.icns
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  hardenedRuntime: true
  notarize: true
dmg:
  artifactName: Inteligir-${version}-${arch}.${ext}
# Electron fuses — flipped in the binary pre-signing (app-builder-lib
# platformPackager). Defence in depth on a notarized app: without these the
# shipped binary will happily run arbitrary JS as node (ELECTRON_RUN_AS_NODE),
# accept --inspect, and honour NODE_OPTIONS. Safe to disable for this app:
# nothing in first-party source reads ELECTRON_RUN_AS_NODE or NODE_OPTIONS, and
# there is no process.fork/utilityProcess.
#
# The window loads an https origin, so `grantFileProtocolExtraPrivileges` no
# longer has anything to grant and is revoked.
#
# MUST be validated with a real packaged build before shipping — hardened
# runtime is not applied by `pnpm dev:desktop`, so this cannot be exercised in
# dev. enableEmbeddedAsarIntegrityValidation + onlyLoadAppFromAsar are the two
# that fail CLOSED (the app will not launch) on an asar hash mismatch.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
npmRebuild: false
publish:
  provider: github
  owner: kyh
  repo: inteligir
  # Publish straight to a live release instead of electron-builder's default
  # draft, so `release:publish` doesn't require a manual un-draft step.
  releaseType: release
