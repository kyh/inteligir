# unsigned, un-notarized local artifact; README.md documents the release path
appId: com.inteligir.desktop
productName: Inteligir
directories:
  buildResources: resources
  output: .output/bin
# node_modules unpacked: the server is spawned as a child process and cannot run from an asar
asar: true
asarUnpack:
  - node_modules/**
files:
  - .output/app/**
  - node_modules/**
  - package.json
  - resources/icon.png
  - "!**/*.map"
# npmRebuild off: the three native modules are prebuilt Node-API addons (ABI-stable across
# Node and Electron), and a rebuild would clobber the pnpm store's shared copy
npmRebuild: false
mac:
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: Inteligir-${version}-${arch}.${ext}
  category: public.app-category.productivity
  icon: resources/icon.icns
  # hardenedRuntime without a signature produces an app Gatekeeper refuses elsewhere
  identity: null
  notarize: false
  hardenedRuntime: false
dmg:
  sign: false
publish: null
