appId: com.inteligir.desktop
productName: Inteligir
directories:
  buildResources: resources
  output: .output/bin
files:
  - .output/app/**/*
  - package.json
  - resources/agent/**/*
  - "!node_modules"
asarUnpack:
  - resources/**
  # sherpa-onnx-node ships native .node binaries (split into per-platform
  # optional deps like sherpa-onnx-node-darwin-arm64). .node files cannot be
  # require()'d from inside an asar archive, so unpack the whole tree.
  - node_modules/sherpa-onnx-node/**/*
  - node_modules/sherpa-onnx-node-*/**/*
mac:
  artifactName: Inteligir-${version}-${arch}-mac.${ext}
  category: public.app-category.productivity
  icon: resources/icon.icns
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  hardenedRuntime: true
  notarize: true
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSAppleEventsUsageDescription: Inteligir uses Apple Events to control other applications when you ask the agent to act on them.
    NSScreenCaptureUsageDescription: Inteligir captures the screen so the agent can see and interact with native applications.
dmg:
  artifactName: Inteligir-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: kyh
  repo: inteligir
