appId: com.inteligir.desktop
productName: Inteligir
directories:
  buildResources: resources
  output: .output/bin
files:
  - .output/app/**/*
  - package.json
  - "!node_modules"
  - node_modules/koffi/**/*
  - "!node_modules/koffi/build/koffi/linux_*"
  - "!node_modules/koffi/build/koffi/win32_*"
  - "!node_modules/koffi/build/koffi/freebsd_*"
  - "!node_modules/koffi/build/koffi/openbsd_*"
  - "!node_modules/koffi/build/koffi/musl_*"
  - node_modules/onnxruntime-node/**/*
  - "!node_modules/onnxruntime-node/bin/napi-v3/linux"
  - "!node_modules/onnxruntime-node/bin/napi-v3/win32"
  - node_modules/sharp/**/*
  - node_modules/@img/sharp-darwin-arm64/**/*
  - node_modules/@livekit/rtc-node/**/*
  - node_modules/@livekit/agents-plugin-silero/**/*
asarUnpack:
  - node_modules/koffi/**/*.node
  - node_modules/onnxruntime-node/**/*.node
  - node_modules/@img/sharp-darwin-arm64/**/*.node
  - node_modules/@livekit/rtc-node/**/*.node
  - resources/**
mac:
  artifactName: Inteligir-${version}-${arch}-mac.${ext}
  category: public.app-category.productivity
  icon: resources/icon.icns
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  hardenedRuntime: true
  notarize: true
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
dmg:
  artifactName: Inteligir-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: kyh
  repo: inteligir
