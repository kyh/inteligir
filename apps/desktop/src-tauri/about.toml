# cargo-about's reading of the crates the shell links into its one binary (scripts/package.ts):
# a crate under a licence this list does not name fails the pack, and of a choice the earliest
# named is the one the notices carry
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Zlib",
  "Unlicense",
  "ISC",
  "BSD-3-Clause",
  "MPL-2.0",
  "MIT-0",
  "CC0-1.0",
  "0BSD",
]
targets = ["aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
