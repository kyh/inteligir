[package]
name = "inteligir-desktop"
description = "The Inteligir desktop shell"
authors = ["kyh"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "inteligir_desktop"

[build-dependencies]
tauri-build = { version = "2.7", features = ["isolation"] }

[dependencies]
# the network the file cache fetches a miss over, the same client and TLS the updater's plugin
# links, so the shell carries one HTTP stack and one crypto provider
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rusqlite = { version = "0.41", features = ["bundled", "hooks", "limits"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.12", features = ["image-png", "isolation", "tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.13"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

# the shell runs on Linux only under the scenario suite, which has no Keychain: keyring-core's
# sample store, in a file under the app's data dir, stands in for it there
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring-core = { version = "1", features = ["sample"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["hostname"] }
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
expect_used = "warn"
unwrap_used = "warn"
