<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      This page carries a CSP so the fast loop can see policy violations at
      all. jsdom does not enforce CSP, so without one here NO verification
      surface catches a renderer policy that forbids what a shipped node
      renders — the packaged app is the first place it would show.

      Keep the resource directives (frame-src / connect-src / img-src /
      font-src / object-src) BYTE-IDENTICAL to
      apps/desktop/src/renderer/index.html. That is the whole point — a change
      that breaks embeds in the packaged app must break them here first.

      script-src and style-src deliberately DIVERGE: this page is served by the
      harness Vite dev server, never packaged, so it takes 'unsafe-inline'
      rather than tracking the react-plugin preamble hash. Nothing ships from
      this file; do not copy those relaxations back into the renderer.

      'wasm-unsafe-eval' is required and is NOT a renderer concern: the harness
      runs the real knowledge engine in-page over @sqlite.org/sqlite-wasm, and
      WebAssembly.instantiate is blocked without it — the whole app silently
      fails to mount (root has zero children, console shows
      "Compiling or instantiating WebAssembly module violates ... 'unsafe-eval'").
      The packaged renderer needs no such grant because it reaches sqlite
      through node:sqlite in the MAIN process, never in the page. Prefer
      'wasm-unsafe-eval' over 'unsafe-eval' — it permits WASM compilation only,
      not eval() or new Function().
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self' data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:* https:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src vault-app: https:"
    />
    <title>Inteligir dev harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
