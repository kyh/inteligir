<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Timetable</title>
    <meta property="og:site_name" content="Rail Example" />
  </head>
  <body>
    <main>
      <h1>Weekday timetable</h1>
      <p>
        Trains run every half hour between the two stations, with an extra service at peak times.
      </p>
      <table>
        <tr>
          <th rowspan="2">Station</th>
          <th colspan="2">Morning</th>
        </tr>
        <tr>
          <th>First</th>
          <th>Peak</th>
        </tr>
        <tr>
          <td>North Quay</td>
          <td>05:40</td>
          <td>07:10</td>
        </tr>
        <tr>
          <td>Old Town</td>
          <td>05:52</td>
          <td>
            <p>07:22</p>
            <p>(fast)</p>
          </td>
        </tr>
      </table>
      <p>Weekend trains run every hour.</p>
    </main>
  </body>
</html>
