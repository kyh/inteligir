# The built-in agent's files (apps/web/agents/<target>/library-agent/), planned on every pull request
# that touches them against each target's own Anthropic workspace with `ant apply --dry-run`, which
# changes nothing and exits 0 even when its plan is blocked: the plan is the reviewer's to read
# (platform.claude.com/docs/en/cli-sdks-libraries/cli/apply#run-ant-apply-in-ci). A target is
# planned only once its workload identity is configured, as the repository variables
# ANTHROPIC_ORGANIZATION_ID and ANTHROPIC_<TARGET>_FEDERATION_RULE_ID and
# ANTHROPIC_<TARGET>_SERVICE_ACCOUNT_ID, each rule matching this repository's pull_request subject
# in its target's workspace alone; until then the job says so and plans nothing. Applying is the
# owner's after the merge, one target at a time with its own workspace's credentials, and commits
# the lockfile it writes (docs/releasing.md § 5); no CI run writes a lockfile.
name: Agents

on:
  pull_request:
    paths:
      - apps/web/agents/**
      - apps/web/scripts/agent-files.ts
      - apps/web/src/worker/agent/library-agent.ts
      - packages/agent-skills/**
      - .github/workflows/agents.yml

permissions:
  contents: read

concurrency:
  group: agents-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: production
            vars: PRODUCTION
          - target: preview
            vars: PREVIEW
    permissions:
      contents: read
      # the GitHub identity token the federation rule exchanges for a short-lived Anthropic one
      id-token: write
    env:
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars[format('ANTHROPIC_{0}_FEDERATION_RULE_ID', matrix.vars)] }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars[format('ANTHROPIC_{0}_SERVICE_ACCOUNT_ID', matrix.vars)] }}
      # pinned by hand, as agent-browser and tauri-driver are in ci.yml: a release download rides no
      # lockfile and no release cooldown
      ANT_VERSION: 2.4.0
    steps:
      - name: Workload identity
        id: identity
        run: |
          if [ -n "$ANTHROPIC_ORGANIZATION_ID" ] && [ -n "$ANTHROPIC_FEDERATION_RULE_ID" ] && [ -n "$ANTHROPIC_SERVICE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the ${{ matrix.target }} workspace's workload identity is not configured, so its agent is not planned"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.identity.outputs.configured == 'true'

      - name: Install ant
        if: steps.identity.outputs.configured == 'true'
        run: |
          curl -fsSL "https://github.com/anthropics/anthropic-cli/releases/download/v${ANT_VERSION}/ant_${ANT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin ant
          ant --version

      # ant reads the federation variables above and this file, and trades it for its own token
      - name: GitHub identity token
        if: steps.identity.outputs.configured == 'true'
        run: |
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/gha-jwt"
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/gha-jwt" >> "$GITHUB_ENV"

      # from the target's own directory, where its lockfile sits, naming that directory alone
      - name: Plan
        if: steps.identity.outputs.configured == 'true'
        working-directory: apps/web/agents/${{ matrix.target }}/library-agent
        run: ant apply --dry-run .
