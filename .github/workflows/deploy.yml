# CLOUDFLARE_API_TOKEN needs Workers Scripts: Edit + Workers Routes: Edit (inteligir.com).
# The D1 schema is not applied here: push it from a local machine before merging code
# that needs it, or the deploy 500s against the old schema.
name: Deploy

# workflow_run rather than push: a push trigger races CI and can publish a red tree
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}

jobs:
  detect-changes:
    # `branches` filters on head_branch, which a fork's pull request can also name main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.check.outputs.web }}
    steps:
      # workflow_run checks out the default branch tip unless told the tested SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true

      # diff against the deployed/web tag, not HEAD^: a multi-commit push whose last
      # commit is docs-only would otherwise read as "web unchanged"
      - name: Detect changed apps
        id: check
        run: |
          BASE="$(git rev-parse -q --verify refs/tags/deployed/web 2>/dev/null || true)"
          if [ -z "$BASE" ]; then
            echo "no deployed/web tag — deploying" >&2
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for app in web; do
            output=$(pnpm turbo ls --filter="@repo/${app}...[${BASE}]") || { echo "${app}=true" >> "$GITHUB_OUTPUT"; continue; }
            if echo "$output" | grep -q "@repo/"; then
              echo "${app}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${app}=false" >> "$GITHUB_OUTPUT"
            fi
          done

  deploy-web:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.web == 'true' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # reviewers, wait timers and branch policy hang off the environment in repo settings
    environment:
      name: production
      url: https://inteligir.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true

      - name: Build & deploy web
        run: pnpm turbo run build --filter=@repo/web... && pnpm -F @repo/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Mark what was deployed
        run: |
          git tag -f deployed/web "${{ github.event.workflow_run.head_sha }}"
          git push -f origin refs/tags/deployed/web
