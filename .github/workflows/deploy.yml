# Deploys @repo/web to Cloudflare Workers on push to main.
#
# Requires the CLOUDFLARE_API_TOKEN repo secret: a Cloudflare API token with
# "Workers Scripts: Edit" (account) + "Workers Routes: Edit" (inteligir.com
# zone) permissions.
name: Deploy

# Gated on CI rather than on the push: a `push` trigger races the test run and
# can publish from a red tree. `workflow_run` fires only after CI reports, and
# the jobs below refuse anything but a success.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Deploying needs no repo write. The credential that matters is
# CLOUDFLARE_API_TOKEN below; GITHUB_TOKEN's only consumer here is checkout,
# which needs read. Pin it rather than inheriting the repo's write-scoped
# default — this workflow runs on `push` to main, so it never gets the
# read-only token a fork pull_request would.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}

jobs:
  detect-changes:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.check.outputs.web }}
    steps:
      # workflow_run checks out the DEFAULT branch tip unless told otherwise,
      # which would deploy whatever main happens to be rather than the commit
      # CI just passed. Pin both to the tested SHA.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Detect changed apps
        id: check
        run: |
          BASE="$(git rev-parse "${{ github.event.workflow_run.head_sha }}^" 2>/dev/null || echo 0000000000000000000000000000000000000000)"
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for app in web; do
            output=$(pnpm turbo ls --filter="@repo/${app}...[${BASE}]") || { echo "${app}=true" >> "$GITHUB_OUTPUT"; continue; }
            if echo "$output" | grep -q "@repo/"; then
              echo "${app}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${app}=false" >> "$GITHUB_OUTPUT"
            fi
          done

  deploy-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # A named environment is the seam a deploy gate hangs off: required
    # reviewers, a wait timer and a branch policy are configured against the
    # environment in repo settings, not in this file. It also gives each run a
    # deployment record pointing at what it published.
    #
    # It is not the CI gate — the `workflow_run` trigger is, so a red tree
    # never reaches inteligir.com. @repo/web is ONE Worker carrying the
    # marketing site AND the backend, so this publishes the API, the Durable
    # Object and the site together — there is no separate manual deploy left.
    environment:
      name: production
      url: https://inteligir.com
    steps:
      # The tested commit, not whatever main has moved to since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build & deploy web
        run: pnpm turbo run build --filter=@repo/web... && pnpm -F @repo/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
