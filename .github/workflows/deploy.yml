# Deploys @repo/web to Cloudflare Workers on push to main.
#
# Repo secrets — two, both pre-existing:
#   CLOUDFLARE_API_TOKEN   Workers Scripts: Edit (account) + Workers Routes:
#                          Edit (inteligir.com zone) to publish, plus D1: Edit
#                          for the schema step below.
#   CLOUDFLARE_ACCOUNT_ID  which account drizzle-kit's HTTP driver targets.
#
# One token serves both steps because a second one would not buy isolation:
# they run in the same job on the same runner, so whatever reaches one reaches
# the other. Splitting them only pays off once the schema step moves to a job
# with its own environment — do it then, not now.
name: Deploy

# Gated on CI rather than on the push: a `push` trigger races the test run and
# can publish from a red tree. `workflow_run` fires only after CI reports, and
# the jobs below refuse anything but a success.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Read by default; the one job that needs more says so itself. The credential
# that matters is CLOUDFLARE_API_TOKEN below — GITHUB_TOKEN's consumers here
# are checkout and the deploy marker tag. Pin it rather than inheriting the
# repo's write-scoped default: this workflow runs on `push` to main, so it
# never gets the read-only token a fork pull_request would.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}

jobs:
  detect-changes:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.check.outputs.web }}
    steps:
      # workflow_run checks out the DEFAULT branch tip unless told otherwise,
      # which would deploy whatever main happens to be rather than the commit
      # CI just passed. Pin both to the tested SHA.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The base is what is DEPLOYED, not the previous commit. Comparing against
      # `HEAD^` answers "did this one commit touch web", so a push of several
      # commits whose last one is a docs edit reads as "web unchanged" and a
      # whole cycle of real changes never ships. The `deployed/web` tag is moved
      # by the deploy job below, so the window is always publish-to-publish; an
      # absent tag (first run, or a deleted tag) deploys rather than assuming.
      - name: Detect changed apps
        id: check
        run: |
          BASE="$(git rev-parse -q --verify refs/tags/deployed/web 2>/dev/null || true)"
          if [ -z "$BASE" ]; then
            echo "no deployed/web tag — deploying" >&2
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for app in web; do
            output=$(pnpm turbo ls --filter="@repo/${app}...[${BASE}]") || { echo "${app}=true" >> "$GITHUB_OUTPUT"; continue; }
            if echo "$output" | grep -q "@repo/"; then
              echo "${app}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${app}=false" >> "$GITHUB_OUTPUT"
            fi
          done

  deploy-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # Write, solely to move the `deployed/web` tag that bounds the next run's
    # change window. Scoped to this job so the detector cannot write anything.
    permissions:
      contents: write
    # A named environment is the seam a deploy gate hangs off: required
    # reviewers, a wait timer and a branch policy are configured against the
    # environment in repo settings, not in this file. It also gives each run a
    # deployment record pointing at what it published.
    #
    # It is not the CI gate — the `workflow_run` trigger is, so a red tree
    # never reaches inteligir.com. @repo/web is ONE Worker carrying the
    # marketing site AND the auth API, so this publishes both together — there
    # is no separate manual deploy left.
    environment:
      name: production
      url: https://inteligir.com
    steps:
      # The tested commit, not whatever main has moved to since.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # THE SCHEMA GOES FIRST, and it is its own step so the ordering is
      # visible rather than buried in a `&&` chain.
      #
      # This repo has no migration files — `drizzle-kit push` IS the documented
      # flow (see apps/web/drizzle.config.ts for why: one deployer, an additive
      # schema, and a test DDL derived from the same source). Nothing was
      # applying it on the deploy path, so a merge that added a table shipped
      # code against the old database and every request touching the new table
      # 500'd until someone ran the push by hand.
      #
      # Order, stated: the schema is additive, so applying it before the
      # publish leaves the OLD code running against a superset it ignores —
      # harmless. The reverse order is not: new code against the old schema
      # fails for real, for the whole window. A push that fails fails the job
      # and nothing is published.
      #
      # `--force` because CI has no tty to answer drizzle's prompt. It is safe
      # for exactly as long as the schema stays additive; a destructive column
      # change is the trigger to adopt migration files, and it must not be
      # discovered by this flag applying it unattended.
      #
      # The database id is the one in apps/web/wrangler.jsonc — an identifier,
      # not a credential — so it is read from the config rather than carried as
      # a fourth secret. The token is the deploy token this job already holds;
      # it needs D1:Edit alongside the Workers scopes wrangler uses.
      - name: Apply the D1 schema
        run: |
          CLOUDFLARE_DATABASE_ID=$(node -e "
            const config = require('node:fs').readFileSync('apps/web/wrangler.jsonc', 'utf8');
            const match = config.match(/\"database_id\":\s*\"([^\"]+)\"/);
            if (match === null) { throw new Error('no database_id in apps/web/wrangler.jsonc'); }
            process.stdout.write(match[1]);
          ") \
          pnpm -F @repo/web exec drizzle-kit push --force
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build & deploy web
        run: pnpm turbo run build --filter=@repo/web... && pnpm -F @repo/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Moved only after a successful publish, so the next run's window starts
      # at what is actually live. A failed deploy leaves the tag where it was
      # and the next run reconsiders the same changes.
      - name: Mark what was deployed
        run: |
          git tag -f deployed/web "${{ github.event.workflow_run.head_sha }}"
          git push -f origin refs/tags/deployed/web
