name: CI

on:
  pull_request:
  push:
    branches: [main]

# The repo default for GITHUB_TOKEN is write-scoped, and a workflow that
# declares no `permissions:` inherits that default wholesale. Nothing in this
# gate touches the repo — it checks out the tree, installs, and runs turbo — so
# pin it to the one scope checkout needs. Worth stating explicitly rather than
# leaning on the fork rule: the `pull_request` leg already gets a read-only
# token for fork PRs, but the `push` to main leg does not.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Turbo's local cache across runs: typecheck/build are the slow steps and
      # are pure functions of their inputs, so an unchanged workspace restores
      # instead of rebuilding. Keyed by SHA with a prefix fallback so a run
      # always starts from the most recent cache on this branch.
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Knip (dead code)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm knip

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

  # The runtime leg of the gate. `check` proves the tree compiles; this proves
  # the app BOOTS: the real renderer UI over the in-memory fixture Bridge (the
  # browser dev harness), driven headlessly — renderer boot, the sidebar over
  # the vault listing, the editor rendering a note, and full-text search
  # through the wasm-sqlite knowledge engine. Deliberately NOT part of `pnpm
  # verify` (which stays the static six steps, runnable with no browser);
  # locally it is `pnpm -F @repo/desktop test:e2e`. Ubuntu on purpose — the
  # harness is a plain browser page, no Electron.
  e2e-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The chromium build only moves when @playwright/test does, and the
      # lockfile hash moves with it.
      - name: Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install chromium
        run: pnpm -F @repo/desktop exec playwright install --with-deps chromium

      - name: Harness smoke
        run: pnpm -F @repo/desktop test:e2e

  # macOS is the platform the desktop app actually ships on, and a meaningful
  # slice of the suite is POSIX-behaviour-sensitive: vault path confinement and
  # OS trash, the host lock, hardenAppDir's 0700/0600 sweep, atomic writes, the
  # sqlite knowledge index, and the createHost boot sequence. The ubuntu leg
  # above stays the full gate (typecheck/lint/knip/format/build); this one runs
  # tests only, so the extra runner minutes buy platform coverage rather than
  # repeating work.
  #
  # Deliberately the WHOLE suite, not a filtered workspace list — a hand-kept
  # filter drifts the moment someone adds a platform-sensitive test elsewhere.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
