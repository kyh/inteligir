name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Knip (dead code)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm knip

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

  # macOS is the platform the desktop app actually ships on, and a meaningful
  # slice of the suite is POSIX-behaviour-sensitive: vault path confinement and
  # OS trash, the host lock, hardenAppDir's 0700/0600 sweep, atomic writes, the
  # sqlite knowledge index, and the createHost boot sequence. The ubuntu leg
  # above stays the full gate (typecheck/lint/knip/format/build); this one runs
  # tests only, so the extra runner minutes buy platform coverage rather than
  # repeating work.
  #
  # Deliberately the WHOLE suite, not a filtered workspace list — a hand-kept
  # filter drifts the moment someone adds a platform-sensitive test elsewhere.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test
