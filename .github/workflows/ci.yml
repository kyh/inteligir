name: CI

on:
  pull_request:
  push:
    branches: [main]

# the push-to-main leg would otherwise inherit the repo's write-scoped token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # a backstop over the e2e runner's per-scenario deadlines
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Tauri compiles the shell against WebKitGTK on Linux (the Mac ships its own WebKit), its menu
      # bar icon loads the appindicator at runtime, and the shell scenarios drive the window
      # through WebKit's own WebDriver
      - name: Desktop system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver

      - name: Desktop Rust toolchain
        working-directory: apps/desktop
        run: rustup toolchain install

      - name: Desktop Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Knip (dead code)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm knip

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      - name: E2E browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # pnpm, not npm: only PNPM_HOME is on PATH here. pinned by hand: a global install
        # rides no lockfile and no release cooldown
        run: pnpm add -g agent-browser@0.36.0 && agent-browser install --with-deps

      - name: E2E shell driver
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # tauri-driver fronts WebKitWebDriver for the shell scenarios. pinned by hand, like
        # agent-browser: a cargo install rides no lockfile. the Rust cache keeps the binary, so a
        # warm run only checks it is that version
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: E2E
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # "E2E browser" installed the browser, "E2E shell driver" the shell's WebDriver, and
        # xvfb-run gives the shell's window the display the runner lacks, so a scenario that skips is
        # a broken setup: --no-skip fails it instead of passing it behind a green step
        run: xvfb-run -a pnpm e2e --no-skip

  # the app ships only as a macOS arm64 .app, and the suites meet APFS, FSEvents and a tmpdir
  # behind a symlink only here; typecheck, lint, knip, format and build read no platform, so the
  # check job alone runs them
  test-macos:
    runs-on: macos-latest
    # a backstop: neither the suites nor the Tauri pack carry a deadline of their own, and a cold
    # release build of the shell is several minutes of it
    timeout-minutes: 50
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # three cores and 7 GB: four suites at once push every timing-bound test past its limit on a
      # slow runner
      TEST_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Desktop Rust toolchain
        working-directory: apps/desktop
        run: rustup toolchain install

      - name: Desktop Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Test
        run: pnpm test

      - name: Smoke desktop
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # ad-hoc whatever the runner's keychain holds; it reaches scripts/package.mjs only because
        # apps/desktop/turbo.json passes it through turbo's strict env
        env:
          INTELIGIR_PACK_UNSIGNED: 1
        run: pnpm smoke:desktop
