name: CI

on:
  pull_request:
  push:
    branches: [main]

# the push-to-main leg would otherwise inherit the repo's write-scoped token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # a backstop: verify and the flows run about 25 minutes on a four-core runner
    timeout-minutes: 45
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # `pnpm verify` and every step after it run on an installed tree, and none of them installs it
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Tauri compiles the shell against WebKitGTK on Linux (the Mac ships its own WebKit)
      - name: Desktop system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev

      # the toolchain apps/desktop/rust-toolchain.toml pins, which verify's clippy and cargo test run on
      - name: Desktop Rust toolchain
        working-directory: apps/desktop
        run: rustup toolchain install

      - name: Desktop Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      # the static gate a developer runs, so a local green predicts this step; turbo continues past a
      # failure, so one run reports every red task. Every step after it is what verify cannot do
      - name: Verify
        run: pnpm verify

      # the full Chromium, which loads an extension, at the lockfile's Playwright's version
      - name: E2E browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @repo/e2e exec playwright install --with-deps --no-shell chromium

      # outside verify on purpose: every unit can pass while the composition fails
      - name: E2E
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm e2e

  # the app ships only as a macOS arm64 .app: the shell's macOS code (its menu, its window)
  # compiles and runs only here; typecheck, lint, knip, format and build read no platform, so the
  # check job alone runs them
  test-macos:
    runs-on: macos-latest
    # a backstop: the suites carry no deadline of their own, and a cold build of the shell is
    # several minutes of it
    timeout-minutes: 50
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # three cores and 7 GB: four suites at once, the editor's 4 GB budget among them, push
      # every timing-bound test past its limit on a slow runner
      TEST_CONCURRENCY: 2
      # the editor's typing budget measures swap on a 7 GB runner; the check job holds it
      SKIP_TYPING_BUDGET: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Desktop Rust toolchain
        working-directory: apps/desktop
        run: rustup toolchain install

      - name: Desktop Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Test
        run: pnpm test
