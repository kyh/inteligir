name: CI

on:
  pull_request:
  push:
    branches: [main]

# the push-to-main leg would otherwise inherit the repo's write-scoped token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # a backstop over the e2e runner's per-scenario deadlines
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Knip (dead code)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm knip

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      - name: E2E browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # pnpm, not npm: only PNPM_HOME is on PATH here. pinned by hand: a global install
        # rides no lockfile and no release cooldown
        run: pnpm add -g agent-browser@0.36.0 && agent-browser install --with-deps

      - name: E2E
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # the step above installed the browser, so one that cannot launch is a broken install:
        # --require-browser fails those scenarios instead of skipping them behind a green step
        run: pnpm e2e --require-browser

  # the app ships only as a macOS arm64 .app, and the suites meet APFS, FSEvents and a tmpdir
  # behind a symlink only here; typecheck, lint, knip, format and build read no platform, so the
  # check job alone runs them
  test-macos:
    runs-on: macos-latest
    # a backstop: neither the suites nor electron-builder carry a deadline of their own
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Smoke desktop
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # unsigned whatever the runner's keychain holds; it reaches electron-builder only because
        # apps/desktop/turbo.json passes it through turbo's strict env
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm smoke:desktop
