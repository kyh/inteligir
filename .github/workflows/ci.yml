name: CI

on:
  pull_request:
  push:
    branches: [main]

# the push-to-main leg would otherwise inherit the repo's write-scoped token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # a backstop: verify and the flows run about 25 minutes on a four-core runner
    timeout-minutes: 45
    # the major production runs: the schema's push and the database suites need a real Postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 5432:5432
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # the server the database suites make their run's databases on (@repo/db/test-database)
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/suites
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # `pnpm verify` and every step after it run on an installed tree, and none of them installs it
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # a second push must plan nothing: drizzle-kit can misread what it created and fail halfway
      # through the next push (packages/db/scripts/check-push.ts)
      - name: Schema push
        env:
          POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: pnpm --filter @repo/db push && pnpm --filter @repo/db push:check

      # the static gate a developer runs, less the shell's, which the macOS job checks, so a local
      # green predicts this step; turbo continues past a failure, so one run reports every red task.
      # Every step after it is what verify cannot do
      - name: Verify
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm verify --filter='!@repo/desktop'

      # the full Chromium, which loads an extension, at the lockfile's Playwright's version
      - name: E2E browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @repo/e2e exec playwright install --with-deps --no-shell chromium

      # outside verify on purpose: every unit can pass while the composition fails
      - name: E2E
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm e2e

  # the app ships only as a macOS arm64 .app: the shell's macOS code (its menu, its window)
  # compiles and runs only here, so its tests, clippy and fmt are this job's alone; every other
  # suite and gate reads no platform, so the check job runs them
  test-macos:
    runs-on: macos-latest
    # a backstop: cargo carries no deadline of its own, and a cold build of the shell is several
    # minutes of it
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # the toolchain apps/desktop/rust-toolchain.toml pins, with its clippy and rustfmt
      - name: Desktop Rust toolchain
        working-directory: apps/desktop
        run: rustup toolchain install

      - name: Desktop Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      # the shell's cargo test, its clippy and the release scripts' tsc, and its cargo fmt check;
      # turbo continues past a failure, so one run reports every red task
      - name: Desktop test, typecheck and format
        run: pnpm turbo run test typecheck format --filter=@repo/desktop --continue=dependencies-successful
