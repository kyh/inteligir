name: CI

on:
  pull_request:
  push:
    branches: [main]

# the push-to-main leg would otherwise inherit the repo's write-scoped token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Knip (dead code)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm knip

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      - name: E2E browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # pnpm, not npm: only PNPM_HOME is on PATH here. the suite skips browser scenarios
        # (still PASS) when agent-browser cannot launch. pinned by hand: a global install
        # rides no lockfile and no release cooldown
        run: pnpm add -g agent-browser@0.36.0 && agent-browser install --with-deps

      - name: E2E
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm e2e
