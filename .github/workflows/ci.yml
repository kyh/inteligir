name: CI

on:
  pull_request:
  push:
    branches: [main]

# the push-to-main leg would otherwise inherit the repo's write-scoped token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # a backstop: verify and the smoke run about 15 minutes on a four-core runner
    timeout-minutes: 30
    # the major production runs: the schema's push and the database suites need a real Postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
        ports:
          - 5432:5432
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # the server the database suites make their run's databases on (@repo/db/test-database)
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/suites
      # the schema's push, and the build, whose route modules open @repo/db's client on import
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # `pnpm verify` and every step after it run on an installed tree, and none of them installs it
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # a second push must plan nothing: drizzle-kit can misread what it created and fail halfway
      # through the next push (packages/db/scripts/check-push.ts)
      - name: Schema push
        run: pnpm --filter @repo/db push && pnpm --filter @repo/db push:check

      # `pnpm bootstrap`'s last step, every fresh clone's first sign-in, which the smoke signs in as.
      # It leans on Better Auth's internals, and run again it must find the
      # account signing in and the invite there, making neither
      - name: Seed
        run: |
          pnpm db:seed
          again=$(pnpm db:seed)
          echo "$again"
          grep -qx "dev@inteligir.local: already there" <<< "$again"
          grep -qx "invite DEV-INVITE: already there" <<< "$again"

      # the static gate a developer runs, so a local green predicts this step; turbo continues past
      # a failure, so one run reports every red task. Every step after it is what verify cannot do
      - name: Verify
        id: verify
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm verify

      # outside verify on purpose: every unit can pass while the composition fails. The build verify
      # made, on next start, which serves eve's agent (here on the mock model), and the seeded login
      # through every door (`pnpm smoke`, which waits for the app's health)
      - name: Smoke
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        env:
          AGENT_MOCK_MODEL: "true"
          APP_URL: http://localhost:5174
          BETTER_AUTH_SECRET: ci-better-auth-secret-000000000000000
          EMAIL_MODE: log
          RATE_LIMIT_DISABLED: "true"
        run: |
          pnpm --filter @repo/web start > "$RUNNER_TEMP/app.log" 2>&1 &
          pnpm smoke

      - name: Server logs
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/app.log"
