name: CI

on:
  pull_request:
  push:
    branches: [main]

# the push-to-main leg would otherwise inherit the repo's write-scoped token
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # a backstop over the e2e runner's per-scenario deadlines; verify and the suite run about 25
    # minutes on a four-core runner before the scenarios that read a page on the runner's own
    # address, which only a runner with such an address runs
    timeout-minutes: 45
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # `pnpm verify` and every step after it run on an installed tree, and none of them installs it
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      # Tauri compiles the shell against WebKitGTK on Linux (the Mac ships its own WebKit), its menu
      # bar icon loads the appindicator at runtime, and the shell scenarios drive the window
      # through WebKit's own WebDriver, `webkitgtk-webdriver` from Ubuntu 26.04 on, where it replaced
      # webkit2gtk-driver
      - name: Desktop system libraries
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkitgtk-webdriver

      # the toolchain apps/desktop/rust-toolchain.toml pins, which verify's clippy and cargo test run on
      - name: Desktop Rust toolchain
        working-directory: apps/desktop
        run: rustup toolchain install

      - name: Desktop Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      # the static gate a developer runs, so a local green predicts this step; turbo continues past a
      # failure, so one run reports every red task. Every step after it is what verify cannot do
      - name: Verify
        run: pnpm verify

      - name: E2E browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # a global install a developer makes once, so verify does not repeat it. pnpm, not npm: only
        # PNPM_HOME is on PATH here. pinned by hand: a global install rides no lockfile and no release
        # cooldown
        run: pnpm add -g agent-browser@0.36.0 && agent-browser install --with-deps

      - name: E2E shell driver
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # tauri-driver fronts WebKitWebDriver for the shell scenarios, a cargo install a developer
        # makes once. pinned by hand, like agent-browser: a cargo install rides no lockfile. the Rust
        # cache keeps the binary, so a warm run only checks it is that version
        run: cargo install tauri-driver --version 2.1.0 --locked

      - name: E2E
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # outside verify on purpose: it boots real instances and drives them over the wire, because
        # every unit can pass while the composition fails. The two steps above provide the browser
        # and the shell's WebDriver and xvfb-run the display, so a skip is a broken setup, and
        # --no-skip fails it rather than passing it behind a green step. Two lanes, half the
        # runner's four cores, which is what a four-core machine's default runs, so a local run
        # is the one CI runs; the shell scenarios hold the one display one at a time
        run: xvfb-run -a pnpm e2e --no-skip --lanes 2

  # the app ships only as a macOS arm64 .app, and the suites meet APFS, FSEvents and a tmpdir
  # behind a symlink only here; typecheck, lint, knip, format and build read no platform, so the
  # check job alone runs them
  test-macos:
    runs-on: macos-latest
    # a backstop: neither the suites nor the Tauri pack carry a deadline of their own, and a cold
    # release build of the shell is several minutes of it
    timeout-minutes: 50
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # three cores and 7 GB: four suites at once, the editor's 4 GB budget among them, push
      # every timing-bound test past its limit on a slow runner
      TEST_CONCURRENCY: 2
      # the editor's typing budget measures swap on a 7 GB runner; the check job holds it
      SKIP_TYPING_BUDGET: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Desktop Rust toolchain
        working-directory: apps/desktop
        run: rustup toolchain install

      - name: Desktop Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Test
        run: pnpm test

      - name: Smoke desktop
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # only a macOS host can pack or boot the .app, and packing takes minutes, so it stays out of
        # verify, which runs on every platform
        env:
          # ad-hoc whatever the runner's keychain holds; it reaches scripts/package.ts only because
          # apps/desktop/turbo.json passes it through turbo's strict env
          INTELIGIR_PACK_UNSIGNED: 1
        run: pnpm smoke:desktop
