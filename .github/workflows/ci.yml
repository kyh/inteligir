name: CI

on:
  pull_request:
  push:
    branches: [main]

# The repo default for GITHUB_TOKEN is write-scoped, and a workflow that
# declares no `permissions:` inherits that default wholesale. Nothing in this
# gate touches the repo — it checks out the tree, installs, and runs turbo — so
# pin it to the one scope checkout needs. Worth stating explicitly rather than
# leaning on the fork rule: the `pull_request` leg already gets a read-only
# token for fork PRs, but the `push` to main leg does not.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (version from `packageManager`) and Node, replacing
      # pnpm/action-setup + actions/setup-node. `install: false` keeps the
      # explicit Install step below, whose `id` every later step gates on.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      # Turbo's local cache across runs: typecheck/build are the slow steps and
      # are pure functions of their inputs, so an unchanged workspace restores
      # instead of rebuilding. Keyed by SHA with a prefix fallback so a run
      # always starts from the most recent cache on this branch.
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Knip (dead code)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm knip

      - name: Format check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      # The scenario suite boots real instances and drives them over the wire —
      # the layer `pnpm test` cannot reach, since every unit here passes while
      # the composition fails.
      - name: E2E browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # `pnpm add -g`, not `npm i -g`: pnpm/setup installs Node itself and only
        # puts PNPM_HOME on PATH, so an npm global bin is unreachable. The harness
        # execs `agent-browser` by name, and when it cannot launch it SKIPS every
        # browser scenario while still reporting PASS — a green E2E that tested
        # nothing. Keep this step and the suite honest together.
        run: pnpm add -g agent-browser && agent-browser install --with-deps

      # ONE run, and that is what deleting the document server bought: the
      # workspace is a plain SPA built once and served as files, so the suite
      # drives the same bytes a user gets. It ran twice while a dev entry
      # mounted Vite in the server process and served no policy at all.
      - name: E2E
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm e2e
