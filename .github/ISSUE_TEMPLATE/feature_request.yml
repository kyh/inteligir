name: 🛠 Feature Request
description: Suggest something Inteligir could do for saving, reading or writing
title: "feat: "
labels: ["✨ enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest it. Please fill out this form as completely as you can.
  - type: textarea
    attributes:
      label: What you'd like Inteligir to do
      description: What you are trying to save, read or write, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How you picture it
      description: How you would like it to work, on the Mac, the iPhone or in the browser. A sketch or a screenshot of another app helps.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Anything else
      description: Anything else about it, such as other issues or discussions it is related to.
