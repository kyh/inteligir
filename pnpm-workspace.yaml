packages:
  - apps/*
  - packages/*
  - tools/*
  - e2e

catalog:
  "@base-ui/react": ^1.6.0
  # Dictation (issue #574). Pinned EXACT: the binary arrives through 14
  # per-platform optionalDependencies pinned to the same version, and its
  # postinstall is a no-op unless someone asks to build from source — which is
  # the property `apps/launcher`'s zero-rebuild install depends on, so the
  # version it was verified against is the version that ships.
  "@fugood/whisper.node": 1.1.1
  "@cloudflare/vite-plugin": ^1.47.0
  "@cloudflare/vitest-pool-workers": ^0.18.8
  "@hono/node-server": ~1.19.17
  "@hono/node-ws": ^1.3.1
  "@parcel/watcher": ^2.5.6
  "@tailwindcss/vite": ^4.3.3
  # Start is still RC (issue #545's research report): pin router+start EXACT so
  # a silent daily release cannot move the fetch-entry seam under us.
  "@tanstack/react-router": 1.170.29
  "@tanstack/react-start": 1.168.46
  "@types/better-sqlite3": ^9.6.0
  "@types/mdast": ^4.0.4
  "@types/node": ^26.1.1
  "@types/react": 19.2.17
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react": ^6.0.4
  better-auth: ^1.6.25
  better-sqlite3: ^13.0.3
  citty: ^0.2.2
  consola: ^3.4.2
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  hono: ^4.13.2
  lucide-react: ^1.26.0
  nanoid: ^5.1.16
  react: ^19.2.8
  react-dom: ^19.2.8
  remark-frontmatter: ^5.0.0
  remark-gfm: ^4.0.1
  remark-parse: ^11.0.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.12
  typescript: ^7.0.2
  unified: ^11.0.5
  vite: ^8.1.5
  vitest: ^4.1.10
  wrangler: ^4.114.0
  zod: ^4.4.3

# Supply-chain cooldown: never resolve a version published less than 24h ago,
# so a compromised release has a window to be yanked before it can enter the
# lockfile. pnpm 11 makes 1440 the default — adopting it now de-risks half of
# that major. CI installs --frozen-lockfile, so this only affects resolution
# during a local `pnpm add`/`pnpm update`.
minimumReleaseAge: 1440

# A transitive dep resolved from git/a tarball/a URL bypasses both the cooldown
# above and the registry integrity the lockfile records. Direct deps may still
# be exotic (a deliberate act); a subdep never should be.
blockExoticSubdeps: true

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@tailwindcss/oxide"
  - better-sqlite3
  - esbuild
  - workerd
