packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@base-ui/react": ^1.7.0
  # oRPC (issue #611): ONE contract package, two entry points, four callers.
  # The four halves are versioned together — a contract compiled by one minor
  # and served by another is exactly the drift the package exists to prevent.
  # Pinned EXACT on the v2 beta: a pre-release breaks between patches, so a
  # range would let the four drift onto different betas mid-install.
  "@orpc/client": 2.0.0-beta.31
  "@orpc/contract": 2.0.0-beta.31
  "@orpc/server": 2.0.0-beta.31
  "@orpc/tanstack-query": 2.0.0-beta.31
  # The ACP adapters (issue #588) are CHILD PROCESSES, not imports: agent-runtime
  # spawns them in dev, apps/cli ships them as real dependencies of the published
  # binary, and the two manifests must agree on the version the wire was verified
  # against — pinned EXACT, and
  # codex-acp deliberately held (its bundled core is live-broken upstream, #594).
  "@zed-industries/claude-code-acp": 0.16.2
  "@zed-industries/codex-acp": 0.16.0
  # Dictation (issue #578): streaming Parakeet through sherpa-onnx. Pinned EXACT
  # for the reason the whisper pin it replaces stated — the binary arrives
  # through 6 per-platform optionalDependencies and there is NO install/build
  # script (a prebuilt N-API addon), which is the property `npx inteligir`'s
  # zero-rebuild install depends on, so the version verified against is the one
  # that ships. `tar` + `unbzip2-stream` extract the `.tar.bz2` model archive in
  # pure JS (Node has no bzip2, and Windows' tar.exe cannot do `-j`).
  "sherpa-onnx-node": 1.13.6
  tar: ^7.5.22
  unbzip2-stream: ^1.4.3
  "@cloudflare/vite-plugin": ^1.54.2
  "@cloudflare/vitest-pool-workers": ^0.22.0
  # The mobile companion (issue #576). Expo SDK 57 uses `~57.0.x` unified
  # versioning across its own packages; the react-native peers carry their own
  # ranges. Recovered from the pre-purge catalog — the app is a sync-only
  # thread/capture client, no native module beyond the Keychain/Keystore.
  "@expo/metro-runtime": ~57.0.14
  # Held on 1.x: @hono/node-ws peers on `@hono/node-server: ^1.19.11` and has no
  # 2.x-compatible release. node-server 2.0 is otherwise drop-in for the `serve` /
  # `serve-static` used here (public API unchanged; it drops the unused vercel
  # adapter and needs Node 20+). Lift both together, never node-server alone.
  "@hono/node-server": ~1.19.17
  "@hono/node-ws": ^1.3.1
  "@parcel/watcher": ^2.6.0
  "@tailwindcss/vite": ^4.3.3
  "@testing-library/dom": ^10.4.1
  "@testing-library/react": ^16.3.3
  # Pinned EXACT, and the codegen plugin with it: the generated route tree is
  # an artifact of the plugin's version, so a silent daily release would
  # rewrite a committed file under a build nobody asked to change. The plugin
  # trails the router's own line because it ships on its own cadence. Start is
  # still RC and is apps/web's alone — that is a real SSR marketing site; the
  # product is a plain SPA over the router.
  "@tanstack/react-router": 1.170.29
  "@tanstack/react-start": 1.168.46
  "@tanstack/router-plugin": 1.168.35
  "@types/better-sqlite3": ^9.6.0
  "@types/mdast": ^4.0.4
  "@types/node": ^26.4.0
  "@types/react": 19.2.17
  "@types/react-dom": ^19.2.5
  "@vitejs/plugin-react": ^6.1.1
  better-auth: ^1.7.2
  better-sqlite3: ^13.0.3
  citty: ^0.2.2
  consola: ^3.4.2
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  esbuild: ^0.28.2
  expo: ~57.0.18
  expo-constants: ~57.0.16
  expo-crypto: ~57.0.2
  expo-file-system: ~57.0.6
  expo-linking: ~57.0.8
  expo-router: ~57.0.17
  expo-secure-store: ~57.0.2
  expo-splash-screen: ~57.0.8
  expo-status-bar: ~57.0.1
  expo-system-ui: ~57.0.3
  expo-web-browser: ~57.0.2
  hono: ^4.13.5
  jsdom: ^30.0.1
  lucide-react: ^1.37.0
  nanoid: ^6.0.1
  react: ^19.2.8
  react-dom: ^19.2.8
  react-native: ~0.86.3
  react-native-safe-area-context: ~5.7.0
  react-native-screens: ~4.26.2
  remark-frontmatter: ^5.0.0
  remark-gfm: ^4.0.1
  remark-parse: ^11.0.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.13
  typescript: ^7.0.2
  unified: ^11.0.5
  # Held EXACT on 8.1.5 (rolldown 1.1.5). vite 8.2.2 ships rolldown 1.2.6, whose
  # tree-shaking drops `HOST_COOKIE_PREFIX` while still emitting the
  # `cookies_exports` namespace that references it, so better-auth 1.7's cookies
  # module throws `ReferenceError: HOST_COOKIE_PREFIX is not defined` at module
  # scope and the Worker never starts. Cloudflare's version-creation startup check
  # catches it and answers a bare 500 / error 10002, which reads like a platform
  # outage rather than a broken bundle. A caret does NOT hold this — ^8.1.5
  # resolves to 8.2.2. Verified: 8.1.5 boots (HTTP 200), 8.2.2 does not.
  vite: 8.1.5
  vitest: ^4.1.11
  wrangler: ^4.127.1
  yaml: ^2.9.0
  zod: ^4.5.4
  zustand: ^5.0.15

catalogs:
  # Expo must hold an SDK-blessed React and TypeScript, which diverge from web's.
  # Pinning them in a NAMED catalog keeps that constraint explicit and separately
  # bumpable, instead of an unexplained version literal in apps/mobile/package.json
  # that looks like drift. Bump only alongside an Expo SDK upgrade.
  expo:
    react: 19.2.3
    typescript: ~6.0.3

# Supply-chain cooldown: never resolve a version published less than 24h ago,
# so a compromised release has a window to be yanked before it can enter the
# lockfile. pnpm 11 makes 1440 the default — adopting it now de-risks half of
# that major. CI installs --frozen-lockfile, so this only affects resolution
# during a local `pnpm add`/`pnpm update`.
minimumReleaseAge: 1440
# First-party packages: we publish them, so the cooldown protects nothing and
# only delays adopting our own releases.
minimumReleaseAgeExclude:
  - "@kyh/oxlint"

# A transitive dep resolved from git/a tarball/a URL bypasses both the cooldown
# above and the registry integrity the lockfile records. Direct deps may still
# be exotic (a deliberate act); a subdep never should be.
blockExoticSubdeps: true

allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  electron-winstaller: true
  esbuild: true
  workerd: true

overrides:
  "@types/react": "catalog:"
  # @zed-industries/claude-code-acp pins minimatch EXACT on 10.2.1, which carries
  # GHSA high (ReDoS, patched in 10.2.3). The rest of the tree already resolves
  # 10.2.6, so this only dedupes the one lagging copy onto a patch release of the
  # same major. Drop it once claude-code-acp (or its @agentclientprotocol
  # successor) ships a non-vulnerable pin.
  "minimatch@10": ^10.2.6
