# Supply-chain cooldown: never resolve a version published less than 24h ago,
# so a compromised release has a window to be yanked before it can enter the
# lockfile. pnpm 11 makes 1440 the default — adopting it now de-risks half of
# that major. CI installs --frozen-lockfile, so this only affects resolution
# during a local `pnpm add`/`pnpm update`.
minimumReleaseAge: 1440

# A transitive dep resolved from git/a tarball/a URL bypasses both the cooldown
# above and the registry integrity the lockfile records. Direct deps may still
# be exotic (a deliberate act); a subdep never should be.
blockExoticSubdeps: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - workerd
