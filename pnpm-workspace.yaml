packages:
  - apps/*
  - packages/*

catalog:
  "@base-ui/react": ^1.5.0
  "@sinclair/typebox": ^0.34.49
  "@tailwindcss/postcss": ^4.3.0
  "@tailwindcss/vite": ^4.3.0
  "@types/node": ^25.9.1
  "@types/react": ^19.2.15
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react": ^6.0.2
  lucide-react: ^1.16.0
  next: ^16.2.6
  react: ^19.2.6
  react-dom: ^19.2.6
  tailwindcss: ^4.3.0
  typescript: ^6.0.3
  vite: ^8.0.14

linkWorkspacePackages: true

overrides:
  # lightningcss >=1.30.2 has a JS-visitor serde regression ("expected an
  # object-like struct named Specifier, found ()") that breaks react-native-css's
  # compiler on `var()` inside function args (e.g. hsl(var(--x))) — which is all
  # over the nativewind theme. react-native-css's loader prefers the copy
  # resolved from @expo/metro-config, so pin both paths to the last good
  # version. Scoped so tailwindcss keeps its own (working) copy.
  "react-native-css>lightningcss": 1.30.1
  "@expo/metro-config>lightningcss": 1.30.1

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - electron
  - esbuild
