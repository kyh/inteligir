  "@earendil-works/pi-coding-agent": ^0.82.1
  "@expo/metro-runtime": ~57.0.10
  "@sinclair/typebox": ^0.34.52
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-router": ^1.170.29
  "@tanstack/react-start": ^1.168.46
  "@types/mdast": ^4.0.4
  "@types/node": ^26.2.0
  "@types/react": 19.2.17
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.0.5
  better-auth: ^1.6.29
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  expo: ~57.0.13
  expo-constants: ~57.0.11
  expo-dev-client: ~57.0.12
  expo-linking: ~57.0.6
  expo-router: ~57.0.13
  expo-secure-store: ~57.0.1
  expo-splash-screen: ~57.0.6
  expo-status-bar: ~57.0.1
  expo-system-ui: ~57.0.2
  lucide-react: ^1.31.0
  react: ^19.2.8
  react-dom: ^19.2.8
  react-native: ~0.86.2
  react-native-gesture-handler: ~2.32.0
  react-native-reanimated: 4.5.1
  react-native-safe-area-context: ~5.7.0
  react-native-screens: ~4.26.2
  react-native-worklets: 0.10.1
  remark-frontmatter: ^5.0.0
  remark-gfm: ^4.0.1
  remark-parse: ^11.0.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  unified: ^11.0.5
  vite: ^8.2.1
  vitest: ^4.1.10
  wrangler: ^4.123.0

# Supply-chain cooldown: never resolve a version published less than 24h ago,
# so a compromised release has a window to be yanked before it can enter the
# lockfile. pnpm 11 makes 1440 the default — adopting it now de-risks half of
# that major. CI installs --frozen-lockfile, so this only affects resolution
# during a local `pnpm add`/`pnpm update`.
minimumReleaseAge: 1440
# pi ships fast and the desktop release gate couples to a pi model id, so a
# day-long hold on @earendil-works/* would block the very thing we upgrade for.
minimumReleaseAgeExclude:
  - "@earendil-works/*"

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - electron
  - electron-winstaller
  - esbuild
  - sharp
  - workerd
