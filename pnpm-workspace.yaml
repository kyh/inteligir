packages:
  - apps/*
  # The agent container image is built from this repo and is its own npm
  # project (the Dockerfile installs it), so it is a workspace member rather
  # than a folder inside @repo/web — that is what typechecks it and what lets
  # `pnpm deploy` produce the image's node_modules.
  - apps/web/container
  - packages/*
  - tools/*

# A transitive dep resolved from git/a tarball/a URL bypasses both the cooldown
# above and the registry integrity the lockfile records. Direct deps may still
# be exotic (a deliberate act); a subdep never should be.
blockExoticSubdeps: true

catalog:
  "@base-ui/react": ^1.7.0
  "@cloudflare/vite-plugin": ^1.52.1
  "@cloudflare/vitest-pool-workers": ^0.18.8
