packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@base-ui/react": ^1.8.0
  # exact: the v2 beta breaks between patches; the four must resolve to one build
  "@orpc/client": 2.0.0-beta.31
  "@orpc/contract": 2.0.0-beta.31
  "@orpc/server": 2.0.0-beta.31
  "@orpc/tanstack-query": 2.0.0-beta.31
  # exact: the adapters are spawned as child processes and the sdk speaks to them, so the wire is
  # only verified against one set; a bump re-records packages/agent-runtime's adapter transcripts
  "@agentclientprotocol/claude-agent-acp": 0.81.0
  "@agentclientprotocol/codex-acp": 1.13.0
  "@agentclientprotocol/sdk": 1.5.0
  # exact: prebuilt N-API addon with no build script, which `npx inteligir` depends on.
  # tar + unbzip2-stream because Node has no bzip2 and Windows tar.exe cannot -j
  "sherpa-onnx-node": 1.13.6
  tar: ^7.5.22
  unbzip2-stream: ^1.4.3
  # optional peer @vitejs/plugin-react loads for `compiler: true`
  oxc-transform-react: ^0.151.0
  "@cloudflare/vite-plugin": ^1.57.1
  "@cloudflare/vitest-pool-workers": ^0.22.0
  "@expo/metro-runtime": ~57.0.16
  "@expo/plist": ~0.8.1
  # node-server held on 1.x: @hono/node-ws has no 2.x-compatible release; lift both together
  "@hono/node-server": ~1.19.17
  "@hono/node-ws": ^1.3.1
  "@parcel/watcher": ^2.6.0
  "@tailwindcss/vite": ^4.3.3
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  # exact: the committed route tree is an artifact of the plugin version
  "@tanstack/react-router": 1.170.38
  "@tanstack/react-start": 1.168.56
  "@tanstack/router-plugin": 1.168.40
  "@types/better-sqlite3": ^9.6.0
  "@types/mdast": ^4.0.4
  # tracks engines.node; newer types let a 25+-only API typecheck and throw at runtime
  "@types/node": ^24.13.3
  "@types/react": 19.2.17
  "@types/react-dom": ^19.2.7
  "@vitejs/plugin-react": ^6.1.1
  # exact: 1.7.3+ drops account.issuer, which the D1 schema holds NOT NULL and unique-indexes;
  # lifting it needs a production D1 schema change first
  "@better-auth/drizzle-adapter": 1.7.2
  better-auth: 1.7.2
  better-sqlite3: ^13.0.3
  citty: ^0.2.2
  cn: ^0.3.2
  consola: ^3.4.2
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  # exact: `pnpm testflight:mobile` uploads the build through it, and apps/mobile/eas.json floors
  # cli.version at this release; a bump moves both
  eas-cli: 24.8.0
  esbuild: ^0.28.2
  expo: ~57.0.24
  expo-constants: ~57.0.19
  expo-crypto: ~57.0.3
  expo-file-system: ~57.0.7
  expo-router: ~57.0.22
  expo-secure-store: ~57.0.4
  expo-splash-screen: ~57.0.9
  expo-status-bar: ~57.0.1
  expo-system-ui: ~57.0.4
  expo-updates: ~57.0.23
  hono: ^4.13.8
  jsdom: ^30.1.1
  lucide-react: ^1.47.0
  nanoid: ^6.0.1
  # held under 19.3: @react-three/fiber 9 peers react <19.3
  react: ~19.2.8
  react-dom: ~19.2.8
  react-native: ~0.86.3
  react-native-safe-area-context: ~5.7.0
  react-native-screens: ~4.26.2
  remark-frontmatter: ^5.0.0
  remark-gfm: ^4.0.1
  remark-parse: ^11.0.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  typescript: ^7.0.2
  unified: ^11.0.5
  # exact: 8.2.x's rolldown tree-shakes better-auth's HOST_COOKIE_PREFIX and the Worker
  # dies at module scope with a bare 500
  vite: 8.1.5
  # held on 4.x: @cloudflare/vitest-pool-workers peers vitest ^4.1
  vitest: ^4.1.11
  wrangler: ^4.136.1
  yaml: ^2.9.1
  zod: ^4.6.5
  zustand: ^5.0.15

catalogs:
  # the SDK-blessed react/typescript; bump only with an Expo SDK upgrade
  expo:
    react: 19.2.3
    typescript: ~6.0.3

# Expo-SDK-versioned names: `pnpm up --latest` must not move them past the SDK. Matched by name,
# so react and typescript (shared with web) cannot be listed; their `expo:` rows are reverted by hand
update:
  ignoreDeps:
    - expo
    - expo-*
    - "@expo/*"
    - react-native
    - react-native-*
    - "@react-native/*"

# 24h supply-chain cooldown
minimumReleaseAge: 1440

blockExoticSubdeps: true

allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  # eas-cli's bunyan: an optional DTrace probe it runs without
  dtrace-provider: false
  electron-winstaller: true
  esbuild: true
  # eas-cli's centrifuge: a postinstall that only prints a version notice
  protobufjs: false
  workerd: true

overrides:
  # the adapter's auto-installed peer would otherwise resolve a second, newer core beside better-auth's
  "@better-auth/core": 1.7.2
  "@types/react": "catalog:"
  # the catalog alone does not bind importers that don't spell `catalog:` (vitest's vite)
  vite: "catalog:"

patchedDependencies:
  # the adapter marks every session root trusted, which has codex load the vault's own .codex
  # config, hooks and exec policies, and no per-session option reaches it; the vault is synced
  # content, so the patch marks it untrusted, dropped once upstream lets the client decide
  "@agentclientprotocol/codex-acp@1.13.0": patches/@agentclientprotocol__codex-acp@1.13.0.patch
  # getPluginType resolves a throwaway plugin (two deep merges) for a key no plugin registers, and
  # the markdown serializer asks that of every mark rule on every text node: four fifths of a long
  # note's save. The patch answers from `editor.plugins`, dropped once a release does
  "@platejs/core@53.3.14": patches/@platejs__core@53.3.14.patch
  # micromark merges a paragraph's text with one splice per line, so a long paragraph parses in time
  # quadratic in its lines; the patch is upstream's open fix (micromark/micromark#233), dropped once a
  # release carries it
  micromark@4.0.2: patches/micromark@4.0.2.patch
