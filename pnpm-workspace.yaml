packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@base-ui/react": ^1.8.0
  # exact: the v2 beta breaks between patches; the four must resolve to one build
  "@orpc/client": 2.0.0-beta.31
  "@orpc/contract": 2.0.0-beta.31
  "@orpc/server": 2.0.0-beta.31
  "@orpc/tanstack-query": 2.0.0-beta.31
  # optional peer @vitejs/plugin-react loads for `compiler: true`
  oxc-transform-react: ^0.152.0
  "@cloudflare/vite-plugin": ^1.62.5
  "@cloudflare/vitest-pool-workers": ^0.22.0
  "@expo/metro-runtime": ~57.0.16
  "@expo/plist": ~0.8.1
  # node-server held on 1.x: @hono/node-ws has no 2.x-compatible release; lift both together
  "@hono/node-server": ~1.19.17
  "@hono/node-ws": ^1.3.1
  "@tailwindcss/vite": ^4.3.3
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  # exact: the committed route tree is an artifact of the plugin version
  "@tanstack/react-router": 1.170.38
  "@tanstack/react-start": 1.168.56
  "@tanstack/router-plugin": 1.168.40
  "@types/better-sqlite3": ^9.6.0
  # tracks engines.node; newer types let a 25+-only API typecheck and throw at runtime
  "@types/node": ^24.19.0
  "@types/react": 19.2.17
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  # exact: 1.7.3+ drops account.issuer, which the D1 schema holds NOT NULL and unique-indexes;
  # lifting it needs a production D1 schema change first
  "@better-auth/drizzle-adapter": 1.7.2
  better-auth: 1.7.2
  better-sqlite3: ^13.0.3
  citty: ^0.2.2
  cn: ^0.4.0
  consola: ^3.4.2
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  # exact: `pnpm testflight:mobile` uploads the build through it, and apps/mobile/eas.json floors
  # cli.version at this release; a bump moves both
  eas-cli: 24.8.0
  esbuild: ^0.28.2
  expo: ~57.0.26
  expo-constants: ~57.0.20
  expo-crypto: ~57.0.3
  expo-network: ~57.0.2
  expo-router: ~57.0.24
  expo-secure-store: ~57.0.4
  expo-splash-screen: ~57.0.9
  expo-sqlite: ~57.0.3
  expo-status-bar: ~57.0.1
  expo-system-ui: ~57.0.4
  expo-updates: ~57.0.24
  hono: ^4.13.13
  jsdom: ^30.1.2
  lucide-react: ^1.52.0
  nanoid: ^6.0.1
  # held under 19.3: @react-three/fiber 9 peers react <19.3
  react: ~19.2.8
  react-dom: ~19.2.8
  react-native: ~0.86.3
  react-native-safe-area-context: ~5.7.0
  react-native-screens: ~4.26.2
  remark-gfm: ^4.0.1
  tailwindcss: ^4.3.3
  tsx: ^4.23.15
  typescript: ^7.0.2
  # exact: 8.2.x's rolldown tree-shakes better-auth's HOST_COOKIE_PREFIX and the Worker
  # dies at module scope with a bare 500
  vite: 8.1.5
  # held on 4.x: @cloudflare/vitest-pool-workers peers vitest ^4.1
  vitest: ^4.1.11
  # exact: a beta, whose config API moves between releases
  cf: 1.0.0-beta.12
  # the one wrangler resolves; tools/e2e reads `cf build` output with it
  miniflare: 5.20261001.0-alpha
  wrangler: ^4.147.0
  yaml: ^2.9.1
  zod: ^4.6.5

catalogs:
  # the SDK-blessed react/typescript; bump only with an Expo SDK upgrade
  expo:
    react: 19.2.3
    typescript: ~6.0.3

# Expo-SDK-versioned names: `pnpm up --latest` must not move them past the SDK. Matched by name,
# so react and typescript (shared with web) cannot be listed; their `expo:` rows are reverted by hand
update:
  ignoreDeps:
    - expo
    - expo-*
    - "@expo/*"
    - react-native
    - react-native-*
    - "@react-native/*"

# 24h supply-chain cooldown
minimumReleaseAge: 1440

blockExoticSubdeps: true

allowBuilds:
  "@tailwindcss/oxide": true
  better-sqlite3: true
  # eas-cli's bunyan: an optional DTrace probe it runs without
  dtrace-provider: false
  esbuild: true
  # eas-cli's centrifuge: a postinstall that only prints a version notice
  protobufjs: false
  workerd: true

overrides:
  # the adapter's auto-installed peer would otherwise resolve a second, newer core beside better-auth's
  "@better-auth/core": 1.7.2
  "@types/react": "catalog:"
  # the catalog alone does not bind importers that don't spell `catalog:` (vitest's vite)
  vite: "catalog:"
